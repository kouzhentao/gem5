<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 600; fill: #0f172a; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; rx: 6; }
      .box-data { fill: #eff6ff; stroke: #3b82f6; }
      .box-ctrl { fill: #fff7ed; stroke: #f97316; }
      .label { fill: #1e293b; }
      .arrow { stroke: #475569; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .branch { stroke: #64748b; stroke-width: 1.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <!-- Data path panel -->
  <rect class="panel" x="20" y="20" width="400" height="480"/>
  <text class="title" x="40" y="48">pnï</text>

