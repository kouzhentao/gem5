<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200">
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
  <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
</marker>
<style>
  text { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; fill: #1e293b; }
  .sans { font-family: system-ui, -apple-system, sans-serif; }
  .title { font-size: 14px; font-weight: 600; fill: #0f172a; }
  .hdr { fill: #475569; font-weight: 600; font-size: 11px; }
  .row { fill: #64748b; font-weight: 600; font-size: 11px; }
  .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; }
  .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
  .blue { fill: #eff6ff; stroke: #3b82f6; }
  .orange { fill: #fff7ed; stroke: #f97316; }
  .green { fill: #ecfdf5; stroke: #10b981; }
  .cell { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; }
  .cell-hi { fill: #dbeafe; stroke: #93c5fd; stroke-width: 1; }
  .cell-stall { fill: #fef3c7; stroke: #fbbf24; stroke-width: 1; }
  .arrow { stroke: #475569; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
</style></defs>
<text class="title sans" x="16" y="22">FQ — Fetch Queue（kv_fq.v）</text>
<text x="40" y="58" font-size="11">IC (f2 fetch_resp)</text>
<text x="480" y="58" font-size="11">ID (kv_dec)</text>
<line class="arrow" x1="160" y1="70" x2="200" y2="70"/>
<text x="175" y="62" font-size="10">fq_wr</text>
<line class="arrow" x1="420" y1="70" x2="480" y2="70"/>
<text x="430" y="62" font-size="10">fq_rd</text>
<rect class="panel" x="120" y="80" width="380" height="90" rx="6"/>
<text x="310.0" y="108.0" text-anchor="middle" font-size="11">s0[0..3] 环形 RAM，每项 75b</text>
<text x="310.0" y="122.0" text-anchor="middle" font-size="11">wptr / rptr</text>
<text x="310.0" y="136.0" text-anchor="middle" font-size="11">每拍 fq_wr 入队 1 bundle（最多 4×16b）</text>
<text x="310.0" y="150.0" text-anchor="middle" font-size="11">每拍 fq_rd 出队 0~2 条 → fq_i0 / fq_i1</text>
</svg>
